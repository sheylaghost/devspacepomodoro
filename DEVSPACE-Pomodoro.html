<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>DEVSPACE Pomodoro Timer</title>
<style>
  :root {
    color-scheme: light dark;
    --ink: #302a3b;
    --muted: #6d6577;
    --surface: #ffffff;
    --canvas: #f7f4fb;
    --line: #e7dfef;
    --accent: #7652a8;
    --accent-strong: #63418f;
    --accent-soft: #eee7f7;
    --good: #5a8c73;
    --shadow: 0 8px 24px rgba(54, 37, 77, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f3eff8;
      --muted: #bcb3c8;
      --surface: #292530;
      --canvas: #211e27;
      --line: #45404c;
      --accent: #b49bd6;
      --accent-strong: #d0bceb;
      --accent-soft: #393144;
      --good: #9ac6a9;
      --shadow: 0 8px 24px rgba(0, 0, 0, .18);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    padding: 10px;
    background: transparent;
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .widget {
    width: min(100%, 900px);
    min-height: 230px;
    margin: 0 auto;
    padding: 18px 20px 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--canvas);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 12px;
  }
  .topline, .bottomline, .main, .controls, .modes { display: flex; align-items: center; }
  .topline { justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .mark {
    width: 31px; height: 31px; flex: 0 0 31px; border-radius: 10px;
    display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-strong);
    font-size: 17px; font-weight: 800;
  }
  .eyebrow { color: var(--muted); font-size: 11px; line-height: 1.2; letter-spacing: .13em; font-weight: 750; text-transform: uppercase; }
  .headline { margin: 2px 0 0; font-size: 16px; line-height: 1.2; font-weight: 700; }
  .count { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .count strong { color: var(--accent-strong); font-weight: 750; }
  .main { flex: 1; justify-content: space-between; gap: 20px; }
  .timerbox { flex: 1 1 auto; min-width: 0; }
  .modes { gap: 5px; padding: 4px; width: fit-content; max-width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  button { font: inherit; cursor: pointer; }
  .mode {
    min-height: 34px; padding: 7px 11px; border: 0; border-radius: 7px;
    color: var(--muted); background: transparent; font-size: 12px; font-weight: 650;
  }
  .mode[aria-pressed="true"] { color: var(--accent-strong); background: var(--accent-soft); }
  .clockrow { display: flex; align-items: center; gap: 14px; margin-top: 5px; }
  .clock { font-variant-numeric: tabular-nums; letter-spacing: -.055em; font-size: clamp(46px, 10vw, 64px); line-height: 1.08; font-weight: 720; }
  .progress { width: min(230px, 100%); height: 6px; overflow: hidden; border-radius: 99px; background: var(--line); }
  .progress > span { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--accent); transition: width .25s linear; }
  .status { margin-top: 4px; color: var(--muted); font-size: 12px; min-height: 18px; }
  .actions { display: flex; flex-direction: column; gap: 8px; align-items: stretch; width: 230px; flex: 0 0 230px; }
  .controls { gap: 8px; }
  .start {
    min-height: 46px; flex: 1; padding: 10px 8px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 750; white-space: nowrap;
    transition: background .15s ease, transform .15s ease;
  }
  .start:hover { background: var(--accent-strong); }
  .start:active { transform: translateY(1px); }
  @media (prefers-color-scheme: dark) { .start { color: #211e27; } }
  .secondary {
    width: 58px; min-width: 58px; height: 46px; padding: 0 8px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); color: var(--ink); font-size: 12px; font-weight: 700;
  }
  .secondary:hover { border-color: var(--accent); }
  .bottomline { justify-content: space-between; gap: 10px; color: var(--muted); font-size: 11px; }
  .recipe { white-space: nowrap; }
  .local { text-align: right; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 520px) {
    body { padding: 6px; }
    .widget { min-height: 264px; padding: 14px; gap: 10px; }
    .main { flex-direction: column; align-items: stretch; justify-content: center; gap: 10px; }
    .timerbox { display: flex; flex-direction: column; align-items: center; }
    .modes { width: 100%; justify-content: center; }
    .mode { padding-inline: 9px; }
    .clockrow { flex-direction: column; gap: 4px; margin-top: 3px; }
    .clock { font-size: 52px; }
    .progress { width: min(240px, 90%); }
    .status { margin-top: 2px; }
    .actions { width: 100%; flex: 0 0 auto; flex-direction: row; align-items: center; }
    .controls { flex: 1; }
    .bottomline { font-size: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="widget" aria-label="DEVSPACE Pomodoro timer">
  <header class="topline">
    <div class="brand">
      <div class="mark" aria-hidden="true">✦</div>
      <div>
        <div class="eyebrow">DEVSPACE · STUDY FOCUS</div>
        <h1 class="headline">Pomodoro Timer</h1>
      </div>
    </div>
    <div class="count" aria-label="Completed focus sessions"><strong id="done">0</strong> / 4 sessions</div>
  </header>
  <section class="main" aria-label="Timer controls">
    <div class="timerbox">
      <nav class="modes" aria-label="Timer mode">
        <button class="mode" type="button" data-mode="focus" aria-pressed="true">Focus</button>
        <button class="mode" type="button" data-mode="short" aria-pressed="false">Short break</button>
        <button class="mode" type="button" data-mode="long" aria-pressed="false">Long break</button>
      </nav>
      <div class="clockrow">
        <div class="clock" id="clock" role="timer" aria-label="25 minutes remaining">25:00</div>
        <div class="progress" role="progressbar" aria-label="Session progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress"></span></div>
      </div>
      <div class="status" id="status" aria-live="polite">Ready when you are.</div>
    </div>
    <div class="actions">
      <div class="controls">
        <button class="start" id="start" type="button">Start focus</button>
        <button class="secondary" id="reset" type="button" aria-label="Reset timer">Reset</button>
        <button class="secondary" id="skip" type="button" aria-label="Skip to next session">Skip</button>
      </div>
    </div>
  </section>
  <footer class="bottomline">
    <span class="recipe">25 min focus · 5 min break · 15 min long break</span>
    <span class="local">Saved on this device</span>
  </footer>
</main>
<script>
(() => {
  const durations = { focus: 25 * 60, short: 5 * 60, long: 15 * 60 };
  const labels = { focus: 'Focus', short: 'Short break', long: 'Long break' };
  const storageKey = 'devspace-pomodoro-v1';
  const clock = document.getElementById('clock');
  const startButton = document.getElementById('start');
  const resetButton = document.getElementById('reset');
  const skipButton = document.getElementById('skip');
  const status = document.getElementById('status');
  const done = document.getElementById('done');
  const progress = document.getElementById('progress');
  const progressBar = document.querySelector('[role="progressbar"]');
  const modeButtons = [...document.querySelectorAll('[data-mode]')];
  let state = { mode: 'focus', remaining: durations.focus, endsAt: null, running: false, completed: 0 };
  let lastSecond = -1;

  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
    if (saved && ['focus', 'short', 'long'].includes(saved.mode)) {
      state = { ...state, ...saved };
      if (!Number.isFinite(state.remaining) || state.remaining < 0) state.remaining = durations[state.mode];
      if (!Number.isFinite(state.completed) || state.completed < 0) state.completed = 0;
      if (state.running && Number.isFinite(state.endsAt)) state.remaining = Math.max(0, (state.endsAt - Date.now()) / 1000);
      else state.running = false;
    }
  } catch (_) { /* Use a clean timer if storage is unavailable. */ }

  function save() {
    try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch (_) { /* Timer still works without storage. */ }
  }
  function fmt(seconds) {
    const whole = Math.max(0, Math.ceil(seconds));
    return `${String(Math.floor(whole / 60)).padStart(2, '0')}:${String(whole % 60).padStart(2, '0')}`;
  }
  function render() {
    const remaining = state.running && state.endsAt ? Math.max(0, (state.endsAt - Date.now()) / 1000) : state.remaining;
    const value = fmt(remaining);
    clock.textContent = value;
    clock.setAttribute('aria-label', `${Math.ceil(remaining / 60)} minutes ${Math.ceil(remaining % 60)} seconds remaining`);
    document.title = `${value} · ${labels[state.mode]} · DEVSPACE`;
    done.textContent = String(state.completed % 4);
    modeButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === state.mode)));
    startButton.textContent = state.running ? 'Pause' : (state.mode === 'focus' ? 'Start focus' : 'Start break');
    const fraction = Math.max(0, Math.min(1, 1 - remaining / durations[state.mode]));
    progress.style.width = `${fraction * 100}%`;
    progressBar.setAttribute('aria-valuenow', String(Math.round(fraction * 100)));
  }
  function chime() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const context = new AudioContext();
      [0, .18, .36].forEach((delay, index) => {
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = [660, 784, 988][index];
        gain.gain.setValueAtTime(.0001, context.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(.07, context.currentTime + delay + .02);
        gain.gain.exponentialRampToValueAtTime(.0001, context.currentTime + delay + .14);
        oscillator.connect(gain).connect(context.destination);
        oscillator.start(context.currentTime + delay);
        oscillator.stop(context.currentTime + delay + .15);
      });
      window.setTimeout(() => context.close(), 900);
    } catch (_) { /* Sound is optional. */ }
  }
  function advance(withChime = false) {
    if (withChime) chime();
    if (state.mode === 'focus') {
      state.completed += 1;
      state.mode = state.completed % 4 === 0 ? 'long' : 'short';
      state.statusText = state.mode === 'long' ? 'Four focus sessions complete. Take a longer break.' : 'Focus complete. Take a short break.';
    } else {
      state.mode = 'focus';
      state.statusText = 'Break complete. Ready for another focus session?';
    }
    state.remaining = durations[state.mode];
    state.running = false;
    state.endsAt = null;
    status.textContent = state.statusText;
    save(); render();
  }
  function tick() {
    if (!state.running || !state.endsAt) return;
    const remaining = Math.max(0, (state.endsAt - Date.now()) / 1000);
    const currentSecond = Math.ceil(remaining);
    if (currentSecond !== lastSecond) {
      state.remaining = remaining;
      render();
      lastSecond = currentSecond;
      save();
    }
    if (remaining <= 0) advance(true);
  }
  startButton.addEventListener('click', () => {
    if (state.running) {
      state.remaining = Math.max(0, (state.endsAt - Date.now()) / 1000);
      state.running = false;
      state.endsAt = null;
      status.textContent = 'Paused. Resume whenever you are ready.';
    } else {
      if (state.remaining <= 0) state.remaining = durations[state.mode];
      state.endsAt = Date.now() + state.remaining * 1000;
      state.running = true;
      status.textContent = `${labels[state.mode]} session in progress.`;
      lastSecond = -1;
    }
    save(); render();
  });
  resetButton.addEventListener('click', () => {
    state.running = false;
    state.endsAt = null;
    state.remaining = durations[state.mode];
    status.textContent = 'Timer reset.';
    save(); render();
  });
  skipButton.addEventListener('click', () => {
    state.running = false;
    state.endsAt = null;
    advance(false);
  });
  modeButtons.forEach(button => button.addEventListener('click', () => {
    state.running = false;
    state.endsAt = null;
    state.mode = button.dataset.mode;
    state.remaining = durations[state.mode];
    status.textContent = `${labels[state.mode]} selected.`;
    save(); render();
  }));
  if (state.running && state.remaining <= 0) advance(false);
  else render();
  window.setInterval(tick, 250);
})();
</script>
</body>
</html>
